[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentjev"
version = "1.0.0"
description = "System One decision model for agents: probability distributions from a single non-autoregressive forward pass"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "malevrigns"}]
keywords = ["agents", "decision-making", "non-autoregressive", "calibration", "qwen3"]
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.51.0,<5.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://github.com/malevrigns/agent-jev"
Repository = "https://github.com/malevrigns/agent-jev"
Issues = "https://github.com/malevrigns/agent-jev/issues"
Model = "https://huggingface.co/aimeigaoshou/agent-jev"

[tool.setuptools.packages.find]
include = ["agentjev*", "jev_service*"]
